[archive]
path = "~/SoftwareArchive"
keep_versions = 3 # Sync backfill and explicit prune window; sync never deletes.
include_prereleases = false
include_drafts = false
download_source_code = false
prune_after_sync = false

[platforms]
windows = true
macos = true
linux = true

# Optional selection lists; per-repository lists override these defaults.
[selection]
# Canonical platform list overrides legacy [platforms] flags when present:
# platforms = ["linux"]
# Run `getcraft config detect` to preview host-oriented suggestions first.
architectures = ["x86_64", "arm64", "universal"]
formats = []
include_assets = []
exclude_assets = []
# Per-platform formats override the flat formats list for those platforms:
# formats_by_platform = { linux = ["appimage", "flatpak", "rpm"], windows = ["msi"], macos = ["dmg", "pkg"] }

[[repositories]]
name = "PhotoCraft"
owner = "storytold"
repo = "photocraft"
enabled = true

# Protected tags are additional to keep_versions; matching is exact.
pinned_versions = []
# Optional per-project retention override:
# keep_versions = 3

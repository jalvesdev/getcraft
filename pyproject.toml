[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getcraft"
version = "0.1.0"
description = "Inspect and archive official GitHub releases"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
getcraft = "getcraft.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
